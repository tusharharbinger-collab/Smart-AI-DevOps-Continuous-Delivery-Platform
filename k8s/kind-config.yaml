# k8s/kind-config.yaml
# Kind cluster: 1 control-plane + 2 workers (matches §2 tech stack)
# The control-plane exposes ports 80/443 so the Envoy Gateway can be reached
# from the host without additional port-forwarding.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: smartcd-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      tier: worker
  - role: worker
    labels:
      tier: worker

# monitoring/loki-config.yml
#
# Phase 6 (§06-observability-platform-ops.md, deliverable 6.1) — single-binary
# Loki for local/dev use: filesystem storage, no external object store, no
# separate ring/distributor components. Pairs with monitoring/promtail-config.yml
# (ships container logs here) and Prometheus (already running since Phase 2) —
# both queried from the same Grafana instance.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Local/dev volumes only — this stack is not sized for production log
  # retention. Revisit alongside Phase 7's deployment target if this ever
  # runs somewhere long-lived.
  retention_period: 168h
  allow_structured_metadata: false

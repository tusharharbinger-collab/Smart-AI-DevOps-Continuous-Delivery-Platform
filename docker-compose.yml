# ─────────────────────────────────────────────
# Smart AI DevOps & Continuous Delivery Platform
# ─────────────────────────────────────────────

x-common-env: &common-env
  LOG_LEVEL: INFO
  # Superuser DSN — migrations (`make migrate`) only. `platform` is the
  # postgres image's bootstrap user and is always a superuser, which
  # unconditionally bypasses Row-Level Security — see schema.sql's app_user
  # role and APP_POSTGRES_DSN below for the DSN that actually enforces RLS.
  POSTGRES_DSN: postgresql+asyncpg://platform:platform@postgres:5432/platform
  # Non-superuser DSN — every request-serving query must go through this so
  # RLS policies are actually applied. Used by api-gateway and
  # explainability-service (see their src/db/session.py / src/db.py).
  APP_POSTGRES_DSN: postgresql+asyncpg://app_user:app_password@postgres:5432/platform
  REDIS_URL: redis://redis:6379/0
  VERDICT_SIGNING_KEY: ${VERDICT_SIGNING_KEY:-dev-signing-key-change-in-prod}

services:
  # ─── Infrastructure ───────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api-gateway/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.68.0
    command:
      - run
      - --server
      - --log-level=info
      - --addr=0.0.0.0:8181
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      # The official OPA image is distroless (no /bin/sh, no wget/curl), so a
      # CMD-SHELL healthcheck can never run. `opa eval` with the `http.send`
      # built-in makes a real HTTP request to the server's own /health
      # endpoint entirely in exec form (no shell needed) and exits non-zero
      # if the request fails.
      test: ["CMD", "/opa", "eval", "http.send({\"method\": \"get\", \"url\": \"http://localhost:8181/health\"})"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Platform observability (Phase 6) ──────────────────────────
  # Loki + Promtail + Grafana, alongside the Prometheus already running
  # since Phase 2 — a small "LGTM-lite" stack (no Tempo/tracing yet, see
  # docs/roadmap/06-observability-platform-ops.md's scope note on 6.4).
  loki:
    image: grafana/loki:2.9.9
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.9
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Discovers containers via the Docker socket and reads their log
      # files directly — both are required; the socket alone gives
      # container metadata, not log content.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

  # ─── Sample app cohorts (Phase 2 — Real Telemetry demo pair) ──
  # A real baseline/canary pair running as plain docker-compose services —
  # distinct from the Kind-cluster payment-service-baseline/canary Deployments
  # in k8s/, which are for the real Kubernetes traffic-split demo. This pair
  # exists purely so `docker compose up` alone (no Kind/Envoy needed) gives
  # verification-engine's Prometheus client real, live-scraped metrics to
  # query — see monitoring/prometheus.yml.
  sample-app-baseline:
    build:
      context: ./services/sample-app/v1.0.0
    environment:
      DEPLOYMENT_COHORT: baseline
      APP_VERSION: v1.0.0
      INJECT_ERRORS: "false"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sample-app-canary:
    build:
      context: ./services/sample-app/v1.1.0
    environment:
      DEPLOYMENT_COHORT: canary
      APP_VERSION: v1.1.0
      INJECT_ERRORS: ${CANARY_INJECT_ERRORS:-false}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  load-generator:
    image: alpine/curl:8.9.1
    depends_on:
      sample-app-baseline:
        condition: service_healthy
      sample-app-canary:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      while true; do
        curl -s -o /dev/null -X POST http://sample-app-baseline:8080/api/v1/payments/checkout;
        curl -s -o /dev/null -X POST http://sample-app-canary:8080/api/v1/payments/checkout;
        sleep 0.2;
      done"

  # ─── Microservices ────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      OPA_URL: http://opa:8181
      # Phase 8 — "Connect GitHub" OAuth in the service-creation wizard.
      # Blank by default: the wizard then shows a "not configured" notice and
      # still accepts a public clone URL, rather than breaking.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/github/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Real gap found live: a project's path_prefix was computed at
      # onboarding and thrown away — never persisted or shown to the user,
      # so there was no way to click a link and check "is my product truly
      # live" the way Render/Vercel do. k8s/kind-config.yaml's own port
      # mapping (hostPort 8080 -> control-plane:80) turned out to route
      # nowhere real — nothing on the control-plane node actually listens
      # on port 80; Envoy Gateway's real address only exists via its
      # randomly-allocated NodePort. `cloud-provider-kind` (bin/, running
      # as a background process) is what actually solves this: it gives
      # the Gateway's LoadBalancer Service a genuine host-reachable address
      # by publishing a real host port — 80 today (confirmed live: a
      # deployed project's path now returns a real response through it,
      # not a hang). Once a real cloud target exists (roadmap 9.5) this
      # becomes that target's real load balancer DNS name instead.
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://localhost}
      # Module 8 — AWS ECS deploy target's real load-balancer DNS name (one
      # shared ALB for every "aws_ecs" project, weighted target groups per
      # project instead of one ALB each, to avoid per-project AWS cost).
      # Only used for projects.deploy_target = 'aws_ecs'; a "kubernetes"
      # project ignores this and uses GATEWAY_BASE_URL above instead. Blank
      # by default so a fresh clone with no AWS account configured doesn't
      # advertise a live_url that resolves nowhere; the real value below is
      # this session's actually-provisioned ALB (see docs/roadmap/09-*.md).
      AWS_ALB_BASE_URL: ${AWS_ALB_BASE_URL:-smartcd-platform-alb-1806553190.us-east-1.elb.amazonaws.com}
      # Phase 9.6 (P0 #1, 2026-09-16) — the real "git push -> cloud"
      # trigger. Shared HMAC secret every registered repo's webhook signs
      # deliveries with (X-Hub-Signature-256); blank by default so a fresh
      # clone fails CLOSED (webhooks_router.py refuses to accept any
      # delivery, real or not, until this is set) instead of silently
      # accepting unsigned/forged requests.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # The externally-reachable base URL GitHub's own servers can actually
      # POST to — cannot be localhost for a real webhook (GitHub is not on
      # this machine's network); same class of setting as GATEWAY_BASE_URL/
      # AWS_ALB_BASE_URL above. A real deployment needs a real public
      # domain or tunnel here for POST .../webhook/register to be useful.
      API_GATEWAY_PUBLIC_URL: ${API_GATEWAY_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
      - ./services/api-gateway/src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline-worker:
    build:
      context: ./services/pipeline-worker
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: pipeline-worker
      KUBECONFIG: /home/worker/.kube/config
      # Real bug found live (2026-09-15): shared/opa_client.py's
      # evaluate_policy_sync (the first-deployment freeze-window check)
      # defaults to http://localhost:8181 when this is unset — inside this
      # container that's itself, not OPA, so the call failed with
      # "Connection refused" on every first deployment even though a direct
      # curl to the real OPA container worked fine. api-gateway and
      # policy-controller already set this; pipeline-worker never did
      # because this env var didn't exist yet when its environment block
      # was last written.
      OPA_URL: http://opa:8181
      # Used by tasks/git_clone.py when a pipeline's build stage declares
      # `repoCredentialsEnvVar: GITHUB_TOKEN` (private repos only).
      # Deliberately the SERVER's token, not the end user's OAuth token:
      # the user's token lives in Redis keyed by user id and is never
      # written into pipeline YAML, so a private-repo build needs a
      # credential the worker itself holds. See the private-repo note in
      # docs/roadmap/08-project-workspaces.md.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # EKS actuation target (optional) — see shared/eks_auth.py. Blank
      # EKS_CLUSTER_NAME keeps every _load_kube() call on today's local/Kind
      # path unchanged.
      EKS_CLUSTER_NAME: ${EKS_CLUSTER_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Guaranteed Live Web App CI/CD (2026-09-17) — real gap found live:
      # this was only ever wired into api-gateway's environment block (for
      # display purposes, _live_url()), never here even though worker.py's
      # blue-green/first-deployment branches need it for a real post-
      # cutover HTTP GET (shared/live_url_check.py::verify_live_url).
      # Without it, verify_live_url always reports "not configured" and
      # blue-green rolls back a cutover that actually succeeded. Same
      # default as api-gateway's copy — must match exactly, since a
      # mismatch would make one service verify against the wrong ALB.
      AWS_ALB_BASE_URL: ${AWS_ALB_BASE_URL:-smartcd-platform-alb-1806553190.us-east-1.elb.amazonaws.com}
      # Gate 1 (P0, 2026-09-16) — the gate1 consumer calls back into this
      # once a webhook-triggered push's real build+test dry run finishes
      # (POST .../internal/{project_id}/gate1-result). Same Docker-network
      # service name every other cross-service call in this compose file
      # already uses (see PIPELINE_WORKER_URL/POLICY_CONTROLLER_URL on the
      # other services) — no new discovery mechanism invented for this one.
      API_GATEWAY_URL: http://api-gateway:8000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - default
      # `kind` is the Docker network the Kind cluster's nodes run on — without
      # this, the mounted kubeconfig's server address (the control-plane
      # container's name) would be unreachable from this container even
      # though it resolves fine from the host.
      - kind
    volumes:
      - ./shared:/app/shared:ro
      - ./services/pipeline-worker/src:/app/src:ro
      - ./pipelines:/app/pipelines:ro
      # Real bug found live (while running the legacy demo pipeline's build
      # stage for the first time — it always skipped straight to
      # progressive_verify before, per build_task.py's own docstring): its
      # dockerfilePath ("sample-app/v1.1.0/Dockerfile") resolves relative to
      # this container's /app, but services/sample-app was never mounted
      # here at all, so `docker build` always failed with "You must specify
      # a directory to build in path" the first time this stage actually ran.
      - ./services/sample-app:/app/sample-app:ro
      - ./k8s/generated/incluster-kubeconfig.yaml:/home/worker/.kube/config:ro
      # Real bug found live: build_task.py's `docker build` subprocess and
      # preflight.py's `docker image inspect` both assume a reachable Docker
      # daemon (the Dockerfile installs the `docker.io` CLI package for
      # exactly this), but nothing ever mounted the socket — every real
      # build/deploy stage would have failed with "Cannot connect to the
      # Docker daemon" the first time a pipeline actually used them (the
      # seeded demo pipelines skip straight to progressive_verify, so this
      # was never exercised). Read-only, matching promtail's identical mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  verification-engine:
    build:
      context: ./services/verification-engine
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: verification-engine
      PROMETHEUS_URL: http://prometheus:9090
      # NOTE: No KUBECONFIG — structural boundary enforced here
      # CloudWatch telemetry (P1, 2026-09-16) — telemetry/cloudwatch_client.py
      # needs a real boto3 session to call cloudwatch:GetMetricData and
      # elbv2:Describe* (read-only; see that module's own docstring for why
      # this is safe under the same "verification-engine never touches
      # Kubernetes" boundary — these are AWS read-only calls, not cluster
      # mutations, and this service still has no kubernetes dependency at
      # all). Same three vars pipeline-worker's block above already sets for
      # its own AWS ECS actuation calls; blank by default so a fresh clone
      # with no AWS account configured just gets CloudWatchQueryError on any
      # AWS-target verify request instead of failing to start.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
      - ./services/verification-engine/src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  policy-controller:
    build:
      context: ./services/policy-controller
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: policy-controller
      OPA_URL: http://opa:8181
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      KUBECONFIG: /home/controller/.kube/config
      EKS_CLUSTER_NAME: ${EKS_CLUSTER_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Guaranteed Live Web App CI/CD (2026-09-17) — same real gap as
      # pipeline-worker's identical copy of this comment: never wired in
      # here before, even though graduate_canary_ecs's post-graduation
      # live-URL check (shared/live_url_check.py) needs it. Must match
      # every other service's copy exactly.
      AWS_ALB_BASE_URL: ${AWS_ALB_BASE_URL:-smartcd-platform-alb-1806553190.us-east-1.elb.amazonaws.com}
    depends_on:
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - default
      - kind
    volumes:
      - ./shared:/app/shared:ro
      - ./services/policy-controller/src:/app/src:ro
      - ./k8s/generated/incluster-kubeconfig.yaml:/home/controller/.kube/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  explainability-service:
    build:
      context: ./services/explainability-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: explainability-service
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Real gap found live: this dev machine's corporate network runs all
      # egress through a Netskope TLS-inspecting proxy — outbound HTTPS to
      # api.groq.com (a public SaaS API, unlike the container-to-container
      # calls this service otherwise makes) fails cert verification against
      # the default bundle since Netskope re-signs traffic with its own CA.
      # shared/combined-ca-bundle.pem is certifi's bundle + that CA appended.
      SSL_CERT_FILE: /app/shared/combined-ca-bundle.pem
      REQUESTS_CA_BUNDLE: /app/shared/combined-ca-bundle.pem
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
      - ./services/explainability-service/src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  loki-data:
  grafana-data:

networks:
  default: {}
  # The Kind cluster (`kind create cluster`) creates this network for its
  # node containers. It must already exist (`kind get clusters` / `make
  # kind-up`) before `docker compose up` connects pipeline-worker and
  # policy-controller to it — it is not created by this compose file.
  kind:
    external: true
